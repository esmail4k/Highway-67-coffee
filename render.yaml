# Live ordering via EXISTING free Postgres, original QR URL unchanged. Free DB expires 2026-12-04.
# Existing free database stores live orders; free Postgres expires on 2026-12-04.
# IMPORTANT: free Render filesystem is ephemeral; configure a durable DB/storage before accepting real orders.
services:
  - type: web
    name: highway67-coffee-photo-menu
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/esmail4k/Highway-67-coffee
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_REAL_ORDERS
        value: "1"
      - key: PUBLIC_MENU_ONLY
        value: "1"
      - key: STAFF_PANEL_ENABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: highway67-orders-db
          property: connectionString

      - key: REQUIRE_OWNER_SMS_2FA
        value: "0"
      - key: OWNER_OTP_ENABLED
        value: "0"
      - key: OWNER_PANEL_ENABLED
        value: "1"
      - key: REQUIRE_STAFF_SMS_2FA
        value: "0"
      - key: OWNER_USERNAME
        value: esmail
      - key: STAFF_USERNAME
        value: admin123
      - key: STAFF_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
