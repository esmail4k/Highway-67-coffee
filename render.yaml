# Reuse the existing Highway 67 service and the ORIGINAL printed QR URL.
# FREE preview deployment: product pages can be shown but live order taking is disabled.
# IMPORTANT: free Render filesystem is ephemeral; configure a durable DB/storage before accepting real orders.
services:
  - type: web
    name: highway67-coffee-photo-menu
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/esmail4k/Highway-67-coffee
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_REAL_ORDERS
        value: "0"
      - key: PUBLIC_MENU_ONLY
        value: "1"
      - key: REQUIRE_OWNER_SMS_2FA
        value: "1"
      - key: REQUIRE_STAFF_SMS_2FA
        value: "1"
      - key: OWNER_USERNAME
        value: esmail
      - key: STAFF_USERNAME
        value: admin123
      - key: SESSION_SECRET
        generateValue: true
