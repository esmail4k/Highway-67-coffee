name: Invoice workflow checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [hw67-invoice-management-20261108]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py durable_sqlite.py tests/test_invoice_workflow.py
      - run: node --check static/admin-common.js && node --check static/staff.js && node --check static/owner.js && node --check static/app.js
      - run: node --check static/i18n.js && node tests/test_language.js
      - run: python -m unittest discover -s tests -v
