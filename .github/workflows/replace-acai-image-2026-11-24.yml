name: Replace Highway 67 Acai Smoothie product photo (Nov 24)
on:
  push:
    paths:
      - '.github/workflows/replace-acai-image-2026-11-24.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-product-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact newly uploaded Acai Smoothie photo
        env:
          SOURCE_IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F66f2a03f-80a4-4f31-80ba-1e2fc283f6af/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALqmhl17rOiBI8QCrTY-c6sXJZWxFICRTThEAtYXUKkS&exp=1795552981&osig=AAAAAAAAAAAAAAAAAAAAAM8WmKSb4KTbMMLjXNW4tRcBwkMT8A3NVlfBLMqmiGXj&signer=media-rpc&token=AAIAAU0AJDY2ZjJhMDNmLTgwYTQtNGYzMS04MGJhLTFlMmZjMjgzZjZhZgAAAAABog9MMAhe6K--TQG9nOQveF2dWwxe0x1m1iYmGGTyL0VW0_3hAw&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          import os, subprocess
          source=os.environ['SOURCE_IMAGE_URL']
          # Request the original size where Canva permits; use the signed thumbnail otherwise.
          bigger=source.replace('height:200','height:1254').replace('width:200','width:1254')
          for attempt in (bigger,source):
              proc=subprocess.run(['curl','-fL','--retry','2','--max-time','45','-A','Mozilla/5.0',attempt,'-o','/tmp/acai-new.png'])
              if proc.returncode==0:
                  break
          else:
              raise SystemExit('Could not download uploaded Acai photo')
          PY
      - name: Convert product photo for the existing product asset
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          img=Image.open('/tmp/acai-new.png').convert('RGB')
          # Preserve the photo unchanged in its original square composition.
          img.save('static/assets/acai-original-white.jpg',quality=94,optimize=True,subsampling=0)
          print('Downloaded image dimensions:',img.size)
          PY
      - name: Commit replacement Acai Smoothie image only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/assets/acai-original-white.jpg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Replace Acai Smoothie photo with November 24 uploaded image'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
